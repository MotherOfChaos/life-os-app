    <script>
        const INITIAL_DATA = [];
/* ── GITHUB TOKEN — single source of truth ──────────────────────────
   Stored ONLY in this browser under localStorage key 'github-token'.
   No token is hardcoded in this file. Migrates the legacy 'githubToken'
   key automatically. Prompts once if missing. ------------------------ */
function ghGetToken() {
  var t = localStorage.getItem('github-token') || sessionStorage.getItem('github-token');
  if (!t) {
    var legacy = localStorage.getItem('githubToken');
    if (legacy) { ghSetToken(legacy); localStorage.removeItem('githubToken'); return legacy; }
  }
  return t || '';
}
function ghSetToken(t) {
  localStorage.setItem('github-token', t);
  try { sessionStorage.setItem('github-token', t); } catch (e) {}
}
function ghClearToken() {
  localStorage.removeItem('github-token');
  localStorage.removeItem('githubToken');
  try { sessionStorage.removeItem('github-token'); } catch (e) {}
}
function ghRequireToken() {
  var t = ghGetToken();
  if (!t) {
    t = (window.prompt('GitHub token required (starts with ghp_). Stored only in this browser.') || '').trim();
    if (t.indexOf('ghp_') === 0) { ghSetToken(t); } else { t = ''; }
  }
  return t;
}
        const GITHUB_REPO = "MotherOfChaos/Life-Operating-System";
        const GITHUB_FILE = "PERMANENT_TODO.md";
        
        const app = {
            data: { sections: [], history: [], hasUnsyncedChanges: false, pagination: {}, lastSHA: null },
            TASKS_PER_PAGE: 9999, // Show ALL tasks - no pagination!
            
            async init() {
                // Check token from ALL storage types
                const token = this.getToken();
                if (!token) {
                    document.getElementById('setupModal').classList.remove('hidden');
                    return;
                }
                
                await this.loadData();
                this.render();
                this.updateStats();
                this.updateSyncStatus();
            },
            
            saveToken() {
                const token = document.getElementById('tokenInput').value.trim();
                if (!token || !token.startsWith('ghp_')) {
                    alert('⚠️ Please enter a valid GitHub token starting with ghp_');
                    return;
                }
                
                // TRIPLE STORAGE - save to all 3 locations!
                try {
                    localStorage.setItem('github-token', token);
                    sessionStorage.setItem('github-token', token);
                    this.setCookie('github-token', token, 365);
                    
                    alert('✅ Token saved to 3 storage locations!');
                    document.getElementById('setupModal').classList.add('hidden');
                    this.init();
                } catch (e) {
                    alert('❌ Error saving token: ' + e.message);
                }
            },
            
            setCookie(name, value, days) {
                const expires = new Date(Date.now() + days * 864e5).toUTCString();
                document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/; SameSite=Strict';
            },
            
            getCookie(name) {
                return document.cookie.split('; ').reduce((r, v) => {
                    const parts = v.split('=');
                    return parts[0] === name ? decodeURIComponent(parts[1]) : r;
                }, '');
            },
            
            showSetup() {
                const token = this.getToken() || '';
                document.getElementById('tokenInput').value = token;
                document.getElementById('setupModal').classList.remove('hidden');
            },
            
            getToken() {
                return ghGetToken() || this.getCookie('github-token') || '';
            },
            
            async pullFromGitHub() {
                const token = this.getToken();
                if (!token) { 
                    alert('⚠️ Please set up your GitHub token first!');
                    this.showSetup(); 
                    return; 
                }
                
                const status = document.getElementById('syncStatus');
                status.textContent = 'Pulling...';
                status.className = 'sync-status syncing';
                
                try {
                    const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`;
                    const response = await fetch(url, {
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });
                    
                    if (!response.ok) throw new Error('Failed');
                    
                    const data = await response.json();
                    this.data.lastSHA = data.sha;
                    // Proper UTF-8 decode (atob alone breaks emoji/special chars)
                    const rawBytes = atob(data.content.replace(/\n/g, ''));
                    const uint8 = new Uint8Array(rawBytes.length);
                    for (let i = 0; i < rawBytes.length; i++) uint8[i] = rawBytes.charCodeAt(i);
                    const markdown = new TextDecoder('utf-8').decode(uint8);
                    const newSections = this.parseMarkdown(markdown);
                    this.mergeGitHubData(newSections);
                    await this.restoreSubtasksFromGitHub(token);
                    await this.saveData();
                    this.render();
                    this.updateStats();
                    this.showToast('Pulled from GitHub!');
                    status.textContent = 'Synced';
                    status.className = 'sync-status';
                    
                    // AUTO-RELOAD: Check if app code was updated, reload if needed
                    setTimeout(() => {
                        const appUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/docs/index.html`;
                        fetch(appUrl, {
                            headers: {
                                'Authorization': `token ${token}`,
                                'Accept': 'application/vnd.github.v3+json'
                            }
                        }).then(r => r.json()).then(appData => {
                            const cachedAppSHA = localStorage.getItem('appCodeSHA');
                            if (cachedAppSHA && cachedAppSHA !== appData.sha) {
                                // App code changed! Auto-reload to get new version
                                this.showToast('New app version! Reloading...');
                                setTimeout(() => location.reload(true), 1500);
                            } else {
                                // First time or no change, just save current SHA
                                localStorage.setItem('appCodeSHA', appData.sha);
                            }
                        });
                    }, 500);
                    
                } catch (error) {
                    this.showToast('Pull failed');
                    status.textContent = 'Failed';
                    status.className = 'sync-status pending';
                }
            },
            
            async pushToGitHub() {
                const token = this.getToken();
                if (!token) { 
                    alert('⚠️ Please set up your GitHub token first!');
                    this.showSetup(); 
                    return; 
                }
                
                const status = document.getElementById('syncStatus');
                status.textContent = 'Pushing...';
                status.className = 'sync-status syncing';
                
                try {
                    // ALWAYS fetch latest SHA before pushing (file might have been updated elsewhere!)
                    const getUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`;
                    const getResponse = await fetch(getUrl, {
                        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                    });
                    if (!getResponse.ok) {
                        throw new Error('Could not fetch latest file SHA');
                    }
                    const getData = await getResponse.json();
                    this.data.lastSHA = getData.sha;
                    
                    const markdown = this.generateTODOMarkdown();
                    // Proper UTF-8 encode for push
                    const pushBytes = new TextEncoder().encode(markdown);
                    let pushBinary = '';
                    pushBytes.forEach(b => pushBinary += String.fromCharCode(b));
                    const encodedContent = btoa(pushBinary);
                    const putUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`;
                    const putResponse = await fetch(putUrl, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `TODO update - ${new Date().toLocaleString()}`,
                            content: encodedContent,
                            sha: this.data.lastSHA
                        })
                    });
                    
                    if (!putResponse.ok) {
                        const errorData = await putResponse.json();
                        console.error('GitHub API Error:', errorData);
                        throw new Error(`GitHub API: ${errorData.message || 'Failed'}`);
                    }
                    
                    const putData = await putResponse.json();
                    this.data.lastSHA = putData.content.sha;
                    this.data.hasUnsyncedChanges = false;
                    await this.saveData();
                    // Also push subtasks to GitHub
                    await this.pushSubtasksToGitHub(token);
                    this.showToast('Pushed to GitHub!');
                    status.textContent = 'Synced';
                    status.className = 'sync-status';
                } catch (error) {
                    console.error('Push error details:', error);
                    this.showToast(`Push failed: ${error.message}`);
                    status.textContent = 'Failed';
                    status.className = 'sync-status pending';
                }
            },
            
            parseMarkdown(md) {
                const sections = [];
                const lines = md.split('\n');
                let currentSection = null;
                let currentTask = null;
                let taskId = 1;
                
                // Helper function to clean task text
                const cleanText = (text) => {
                    // Strip markdown bold ** markers
                    text = text.replace(/\*\*/g, '');
                    // Strip other markdown like __ bold
                    text = text.replace(/__/g, '');
                    // Clean up extra whitespace
                    text = text.trim();
                    return text;
                };
                
                for (let line of lines) {
                    line = line.trim();
                    if (line.startsWith('## ')) {
                        if (currentSection && currentSection.tasks.length > 0) sections.push(currentSection);
                        const title = line.substring(3).trim();
                        currentSection = { id: 'section-' + sections.length, title: title, collapsed: false, tasks: [] };
                        currentTask = null;
                    } else if (line.match(/^- \[(x| )\] /) && currentSection) {
                        const completed = line.includes('[x]');
                        let text = line.substring(6).trim();
                        text = cleanText(text); // Clean markdown formatting
                        currentTask = { id: taskId++, text: text, completed: completed, subtasks: [] };
                        currentSection.tasks.push(currentTask);
                    }
                }
                if (currentSection && currentSection.tasks.length > 0) sections.push(currentSection);
                return sections;
            },
            
            mergeGitHubData(newSections) {
                const currentTaskStates = new Map();
                this.data.sections.forEach(section => {
                    section.tasks.forEach(task => {
                        currentTaskStates.set(task.text.toLowerCase(), { completed: task.completed });
                    });
                });
                
                newSections.forEach(section => {
                    section.tasks.forEach(task => {
                        const savedState = currentTaskStates.get(task.text.toLowerCase());
                        if (savedState) task.completed = savedState.completed;
                    });
                });
                
                this.data.sections = newSections;
                this.data.pagination = {};
                newSections.forEach(s => { this.data.pagination[s.id] = { page: 1 }; });
            },
            
            async loadData() {
                const stored = localStorage.getItem('sarah-todo-data');
                if (stored) {
                    this.data = JSON.parse(stored);
                    if (!this.data.pagination) this.data.pagination = {};
                    if (!this.data.lastSHA) this.data.lastSHA = null;
                    if (!this.data.lastResetDate) this.data.lastResetDate = null;
                    
                    // DAILY RESET for NON-NEGOTIABLES
                    const today = new Date().toDateString();
                    if (this.data.lastResetDate !== today) {
                        // Find DAILY NON-NEGOTIABLES section
                        const dailySection = this.data.sections.find(s => 
                            s.title.includes('DAILY') || s.title.includes('NON-NEGOTIABLES')
                        );
                        
                        if (dailySection) {
                            // Reset all tasks to unchecked
                            dailySection.tasks.forEach(task => {
                                task.completed = false;
                                // Also reset subtasks if any
                                if (task.subtasks) {
                                    task.subtasks.forEach(sub => sub.completed = false);
                                }
                            });
                            console.log('✅ Daily tasks reset!');
                        }
                        
                        this.data.lastResetDate = today;
                        await this.saveData();
                    }
                } else {
                    this.data.sections = INITIAL_DATA;
                    this.data.history = [];
                    this.data.hasUnsyncedChanges = false;
                    this.data.pagination = {};
                    this.data.lastSHA = null;
                    this.data.lastResetDate = new Date().toDateString();
                    INITIAL_DATA.forEach(s => { this.data.pagination[s.id] = { page: 1 }; });
                }
            },
            
            async saveData() {
                this.data.hasUnsyncedChanges = true;
                localStorage.setItem('sarah-todo-data', JSON.stringify(this.data));
                this.updateSyncStatus();
            },
            
            updateSyncStatus() {
                const status = document.getElementById('syncStatus');
                status.textContent = this.data.hasUnsyncedChanges ? 'Unsaved' : 'Synced';
                status.className = this.data.hasUnsyncedChanges ? 'sync-status pending' : 'sync-status';
            },
            
            // loadMoreTasks - REMOVED: All tasks now show by default
            // No pagination needed!
            
            generateTODOMarkdown() {
                let md = '# SARAH\'S PERMANENT TO-DO LIST\n\n**Always updated**\n';
                md += `**Last updated:** ${new Date().toLocaleDateString()}\n\n---\n\n`;
                this.data.sections.forEach(section => {
                    md += `## ${section.title}\n\n`;
                    section.tasks.forEach(task => {
                        md += `- ${task.completed ? '[x]' : '[ ]'} ${task.text}\n`;
                    });
                    md += '\n';
                });
                return md;
            },
            
            render() {
                const container = document.getElementById('sections');
                container.innerHTML = '';
                this.data.sections.forEach(section => {
                    const completed = section.tasks.filter(t => t.completed).length;
                    const total = section.tasks.length;
                    // SHOW ALL TASKS - NO PAGINATION!
                    const visibleTasks = section.tasks;
                    
                    const tasksHTML = visibleTasks.map(task => {
                        const subtasksHTML = task.subtasks && task.subtasks.length > 0 ? `
                            <div class="subtasks">
                                ${task.subtasks.map((sub, idx) => `
                                    <div class="subtask ${sub.completed ? 'completed' : ''}">
                                        <input type="checkbox" ${sub.completed ? 'checked' : ''} 
                                            onchange="app.toggleSubtask('${section.id}', ${task.id}, ${idx})">
                                        <div class="subtask-text">${sub.text}</div>
                                        <button class="btn-move-sub" onclick="app.moveSubtaskUp('${section.id}',${task.id},${idx})" title="Move up">↑</button>
                                        <button class="btn-move-sub" onclick="app.moveSubtaskDown('${section.id}',${task.id},${idx})" title="Move down">↓</button>
                                        <button class="btn-edit-sub" onclick="app.editSubtask('${section.id}',${task.id},${idx})" title="Edit">✏️</button>
                                        <button class="btn-delete-sub" onclick="app.deleteSubtask('${section.id}', ${task.id}, ${idx})" title="Delete subtask">🗑️</button>
                                    </div>
                                `).join('')}
                            </div>
                        ` : '';
                        
                        return `
                            <div class="task ${task.completed ? 'completed' : ''}">
                                <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="app.toggleTask('${section.id}', ${task.id})">
                                <div class="task-body">
                                    <div class="task-text">${task.text}</div>
                                    <div class="task-actions">
                                        <button class="btn-add-subtask" onclick="app.showAddSubtask('${section.id}', ${task.id})" title="Add subtask">+</button>
                                        <button class="btn-move" onclick="app.showMoveSheet('${section.id}', ${task.id})" title="Move task">⇅</button>
                                        <button class="btn-edit" onclick="app.editTask('${section.id}', ${task.id})" title="Edit task">✏️</button>
                                        <button class="btn-delete" onclick="app.deleteTask('${section.id}', ${task.id})" title="Delete task">🗑️</button>
                                    </div>
                                    ${subtasksHTML}
                                </div>
                            </div>
                        `;
                    }).join('');
                    
                    // NO LOAD MORE - ALL TASKS ALWAYS VISIBLE!
                    
                    const addTaskHTML = !section.collapsed ? `
                        <div class="add-task-row">
                            <button class="btn-add-task" onclick="app.showAddTask('${section.id}')" title="Add new task">+ Add Task</button>
                        </div>
                    ` : '';
                    
                    container.insertAdjacentHTML('beforeend', `
                        <div class="section">
                            <div class="section-header" onclick="app.toggleSection('${section.id}')">
                                <h2>${section.title} <span class="section-badge">${completed}/${total}</span></h2>
                                <span>${section.collapsed ? 'v' : '^'}</span>
                            </div>
                            <div class="section-content ${section.collapsed ? 'collapsed' : ''}">
                                ${tasksHTML}
                                ${addTaskHTML}
                            </div>
                        </div>
                    `);
                });
            },
            
            toggleSection(id) {
                const s = this.data.sections.find(x => x.id === id);
                if (s) { s.collapsed = !s.collapsed; this.saveData(); this.render(); }
            },
            
            collapseAll() { this.data.sections.forEach(s => s.collapsed = true); this.saveData(); this.render(); },
            expandAll() { this.data.sections.forEach(s => s.collapsed = false); this.saveData(); this.render(); },
            
            async toggleTask(sid, tid) {
                const s = this.data.sections.find(x => x.id === sid);
                const t = s.tasks.find(x => x.id === tid);
                this.data.history.push({ type: 'toggle', sid, tid, prev: t.completed });
                t.completed = !t.completed;
                await this.saveData();
                this.render();
                this.updateStats();
                this.showToast(t.completed ? 'Done!' : 'Undone');
            },
            
            async undo() {
                if (this.data.history.length === 0) { this.showToast('Nothing to undo'); return; }
                const a = this.data.history.pop();
                const s = this.data.sections.find(x => x.id === a.sid);
                if (a.type === 'toggle') { const t = s.tasks.find(x => x.id === a.tid); t.completed = a.prev; }
                await this.saveData();
                this.render();
                this.updateStats();
                this.showToast('Undone!');
            },
            
            async deleteTask(sid, tid) {
                if (!confirm('Delete this task?')) return;
                const s = this.data.sections.find(x => x.id === sid);
                const taskIndex = s.tasks.findIndex(x => x.id === tid);
                if (taskIndex > -1) {
                    s.tasks.splice(taskIndex, 1);
                    this.data.hasUnsyncedChanges = true;
                    await this.saveData();
                    this.render();
                    this.updateStats();
                    this.showToast('Task deleted');
                }
            },
            
            async editTask(sid, tid) {
                const s = this.data.sections.find(x => x.id === sid);
                const task = s.tasks.find(t => t.id === tid);
                const newText = prompt('Edit task:', task.text);
                
                if (newText !== null && newText.trim() && newText.trim() !== task.text) {
                    task.text = newText.trim();
                    this.data.hasUnsyncedChanges = true;
                    await this.saveData();
                    this.render();
                    this.showToast('Task updated');
                }
            },
            
            showAddTask(sid) {
                const taskText = prompt('Enter new task:');
                if (!taskText || !taskText.trim()) return;
                
                const s = this.data.sections.find(x => x.id === sid);
                const maxId = Math.max(0, ...this.data.sections.flatMap(sec => sec.tasks.map(t => t.id)));
                const newTask = {
                    id: maxId + 1,
                    text: taskText.trim(),
                    completed: false,
                    subtasks: []
                };
                
                s.tasks.push(newTask);
                this.data.hasUnsyncedChanges = true;
                this.saveData();
                this.render();
                this.updateStats();
                this.showToast('Task added!');
            },
            
            showAddSubtask(sid, tid) {
                const subtaskText = prompt('Enter subtask:');
                if (!subtaskText || !subtaskText.trim()) return;
                
                const s = this.data.sections.find(x => x.id === sid);
                const task = s.tasks.find(t => t.id === tid);
                
                if (!task.subtasks) task.subtasks = [];
                
                task.subtasks.push({
                    text: subtaskText.trim(),
                    completed: false
                });
                
                this.data.hasUnsyncedChanges = true;
                this.saveData();
                this.render();
                this.showToast('Subtask added!');
            },
            
            async toggleSubtask(sid, tid, subIdx) {
                const s = this.data.sections.find(x => x.id === sid);
                const task = s.tasks.find(t => t.id === tid);
                task.subtasks[subIdx].completed = !task.subtasks[subIdx].completed;
                
                await this.saveData();
                this.render();
                this.updateStats();
                this.showToast(task.subtasks[subIdx].completed ? 'Done!' : 'Undone');
            },
            
            editSubtask(sid, tid, subIdx) {
                const s = this.data.sections.find(x => x.id === sid);
                if (!s) return;
                const task = s.tasks.find(x => x.id === tid);
                if (!task || !task.subtasks) return;
                const current = task.subtasks[subIdx].text;
                const newText = prompt('Edit subtask:', current);
                if (!newText || !newText.trim() || newText.trim() === current) return;
                task.subtasks[subIdx].text = newText.trim();
                this.saveData();
                this.renderSections();
                this.pushSubtasksToGitHub(localStorage.getItem('github-token') ||
                       sessionStorage.getItem('github-token') || '');
                this.showToast('Subtask updated');
            },

            moveSubtaskUp(sid, tid, subIdx) {
                if (subIdx === 0) return;
                const s = this.data.sections.find(x => x.id === sid);
                const task = s && s.tasks.find(x => x.id === tid);
                if (!task || !task.subtasks) return;
                const subs = task.subtasks;
                [subs[subIdx - 1], subs[subIdx]] = [subs[subIdx], subs[subIdx - 1]];
                this.saveData();
                this.renderSections();
                this.pushSubtasksToGitHub(localStorage.getItem('github-token') ||
                       sessionStorage.getItem('github-token') || '');
                this.showToast('Moved up');
            },

            moveSubtaskDown(sid, tid, subIdx) {
                const s = this.data.sections.find(x => x.id === sid);
                const task = s && s.tasks.find(x => x.id === tid);
                if (!task || !task.subtasks) return;
                const subs = task.subtasks;
                if (subIdx >= subs.length - 1) return;
                [subs[subIdx], subs[subIdx + 1]] = [subs[subIdx + 1], subs[subIdx]];
                this.saveData();
                this.renderSections();
                this.pushSubtasksToGitHub(localStorage.getItem('github-token') ||
                       sessionStorage.getItem('github-token') || '');
                this.showToast('Moved down');
            },

            async addSection() {
                const name = prompt('New section name:');
                if (!name || !name.trim()) return;
                const title = name.trim();
                const newSection = {
                    id: 'section-' + Date.now(),
                    title: title,
                    collapsed: false,
                    tasks: []
                };
                this.data.sections.push(newSection);
                this.data.pagination[newSection.id] = { page: 1 };
                this.saveData();
                this.renderSections();
                const _tok = localStorage.getItem('github-token') ||
                       sessionStorage.getItem('github-token') || '';
                await this.pushToGitHub(_tok);
                this.showToast('Section "' + title + '" added!');
            },

            async deleteSubtask(sid, tid, subIdx) {
                if (!confirm('Delete this subtask?')) return;
                const s = this.data.sections.find(x => x.id === sid);
                const task = s.tasks.find(t => t.id === tid);
                task.subtasks.splice(subIdx, 1);
                
                this.data.hasUnsyncedChanges = true;
                await this.saveData();
                this.render();
                this.updateStats();
                this.showToast('Subtask deleted');
            },
            
            async clearCompleted() {
                if (!confirm('Remove all completed tasks?')) return;
                this.data.sections.forEach(s => { s.tasks = s.tasks.filter(t => !t.completed); });
                await this.saveData();
                this.render();
                this.updateStats();
                this.showToast('Cleared!');
            },
            
            updateStats() {
                const all = this.data.sections.flatMap(s => s.tasks);
                const done = all.filter(t => t.completed).length;
                const total = all.length;
                const pct = total > 0 ? Math.round((done / total) * 100) : 0;
                document.getElementById('totalTasks').textContent = total;
                document.getElementById('completedTasks').textContent = done;
                document.getElementById('remainingTasks').textContent = total - done;
                document.getElementById('progressPercent').textContent = pct + '%';
            },
            
            showMoveSheet(sid, tid) {
                const section = this.data.sections.find(x => x.id === sid);
                const task = section.tasks.find(x => x.id === tid);
                const taskIdx = section.tasks.indexOf(task);
                const total = section.tasks.length;

                document.getElementById('moveTaskPreview').textContent = task.text;

                let html = '';
                const sectionLabel = section.title.replace(/[^\x20-\x7E]/g,'').replace(/\[.*?\]\s*/g,'').trim().substring(0,30);

                html += '<div class="move-sheet-section"><h4>Move within &quot;' + sectionLabel + '&quot;</h4>';
                if (taskIdx > 0) {
                    html += `<button onclick="app.moveTaskWithin('${sid}',${tid},'top')">Move to TOP</button>`;
                    html += `<button onclick="app.moveTaskWithin('${sid}',${tid},'up')">Move up one</button>`;
                }
                if (taskIdx < total - 1) {
                    html += `<button onclick="app.moveTaskWithin('${sid}',${tid},'down')">Move down one</button>`;
                    html += `<button onclick="app.moveTaskWithin('${sid}',${tid},'bottom')">Move to BOTTOM</button>`;
                }
                if (total === 1) html += '<button disabled style="opacity:0.4;cursor:default">Only task here</button>';
                html += '</div>';

                html += '<div class="move-sheet-section"><h4>Move to different category</h4>';
                this.data.sections.forEach(s => {
                    if (s.id === sid) return;
                    const label = s.title.replace(/[^\x20-\x7E]/g,'').replace(/\[.*?\]\s*/g,'').trim().substring(0,40);
                    html += `<button onclick="app.moveTaskTo('${sid}',${tid},'${s.id}')">${label || s.id}</button>`;
                });
                html += '</div>';

                document.getElementById('moveSheetContent').innerHTML = html;
                document.getElementById('moveSheet').classList.add('visible');
                document.getElementById('moveOverlay').classList.add('visible');
            },

            closeMoveSheet() {
                document.getElementById('moveSheet').classList.remove('visible');
                document.getElementById('moveOverlay').classList.remove('visible');
            },

            async moveTaskWithin(sid, tid, direction) {
                const section = this.data.sections.find(x => x.id === sid);
                const idx = section.tasks.findIndex(x => x.id === tid);
                const tasks = section.tasks;
                let newIdx = idx;
                if (direction === 'top') newIdx = 0;
                else if (direction === 'bottom') newIdx = tasks.length - 1;
                else if (direction === 'up') newIdx = Math.max(0, idx - 1);
                else if (direction === 'down') newIdx = Math.min(tasks.length - 1, idx + 1);
                if (newIdx === idx) { this.closeMoveSheet(); return; }
                const [task] = tasks.splice(idx, 1);
                tasks.splice(newIdx, 0, task);
                this.data.hasUnsyncedChanges = true;
                await this.saveData();
                this.render();
                this.closeMoveSheet();
                this.showToast('Task moved!');
            },

            async moveTaskTo(fromSid, tid, toSid) {
                const fromSection = this.data.sections.find(x => x.id === fromSid);
                const toSection = this.data.sections.find(x => x.id === toSid);
                const taskIdx = fromSection.tasks.findIndex(x => x.id === tid);
                const [task] = fromSection.tasks.splice(taskIdx, 1);
                toSection.tasks.unshift(task);
                toSection.collapsed = false;
                this.data.hasUnsyncedChanges = true;
                await this.saveData();
                this.render();
                this.closeMoveSheet();
                this.showToast('Task moved!');
            },

            async pushSubtasksToGitHub(token) {
                try {
                    const subtaskMap = {};
                    this.data.sections.forEach(section => {
                        section.tasks.forEach(task => {
                            if (task.subtasks && task.subtasks.length > 0) {
                                subtaskMap[task.text] = task.subtasks;
                            }
                        });
                    });
                    const content = JSON.stringify(subtaskMap, null, 2);
                    let sha = null;
                    try {
                        const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/apps/todo_subtasks.json`, {
                            headers: { 'Authorization': `token ${token}` }
                        });
                        if (r.ok) { const d = await r.json(); sha = d.sha; }
                    } catch(e) {}
                    const pushBytes = new TextEncoder().encode(content);
                    let bin = ''; pushBytes.forEach(b => bin += String.fromCharCode(b));
                    const body = { message: `Subtasks update - ${new Date().toLocaleString()}`, content: btoa(bin) };
                    if (sha) body.sha = sha;
                    await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/apps/todo_subtasks.json`, {
                        method: 'PUT', headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                } catch(e) { console.log('Subtask push error:', e); }
            },

            async restoreSubtasksFromGitHub(token) {
                try {
                    const resp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/apps/todo_subtasks.json`, {
                        headers: { 'Authorization': `token ${token}` }
                    });
                    if (!resp.ok) return;
                    const data = await resp.json();
                    const rawBytes = atob(data.content.replace(/\n/g, ''));
                    const uint8 = new Uint8Array(rawBytes.length);
                    for (let i = 0; i < rawBytes.length; i++) uint8[i] = rawBytes.charCodeAt(i);
                    const subtaskMap = JSON.parse(new TextDecoder('utf-8').decode(uint8));
                    this.data.sections.forEach(section => {
                        section.tasks.forEach(task => {
                            if (subtaskMap[task.text]) task.subtasks = subtaskMap[task.text];
                        });
                    });
                } catch(e) { console.log('No subtasks file or error restoring:', e); }
            },

            showToast(msg) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.add('active');
                setTimeout(() => t.classList.remove('active'), 2500);
            }
        };
        
        window.addEventListener('DOMContentLoaded', () => app.init());
    </script>

    <div class="move-sheet-overlay" id="moveOverlay" onclick="app.closeMoveSheet()"></div>
    <div class="move-sheet" id="moveSheet">
        <h3>Move Task</h3>
        <div class="task-preview" id="moveTaskPreview"></div>
        <div id="moveSheetContent"></div>
        <button class="move-sheet-close" onclick="app.closeMoveSheet()">Cancel</button>
    </div>
</body>
</html>
