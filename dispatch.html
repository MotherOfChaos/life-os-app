<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Times of Chaos</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#0f0f1a;--card:#12121f;--border:#1a1a2e;--text:#e0d8f0;--muted:#5a5a8a;--gold:#c8a830;--gold-dim:rgba(200,168,48,0.1);--gold-border:rgba(200,168,48,0.25);--fire:#e05a20;--rose:#c0304a;--teal:#20a090;--lavender:#7060b0;--amber:#d97706;--green:#30a060}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:'Crimson Pro',Georgia,serif;background:var(--bg);color:var(--text);min-height:100vh;background-image:radial-gradient(ellipse at 50% 0%,rgba(200,168,48,0.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(112,96,176,0.05) 0%,transparent 50%)}
.masthead{text-align:center;padding:32px 20px 20px;border-bottom:1px solid var(--border);position:relative;overflow:hidden}
.masthead::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.masthead-top{font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.4em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.masthead-title{font-family:'UnifrakturMaguntia',cursive;font-size:clamp(2.4rem,8vw,4.5rem);color:var(--gold);line-height:1;margin-bottom:4px;text-shadow:0 0 40px rgba(200,168,48,0.2)}
.masthead-sub{font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.35em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.masthead-date{font-family:'Crimson Pro',serif;font-size:0.8rem;color:var(--muted);font-style:italic}
.masthead-rule{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--gold-border),transparent);margin-top:16px}
.nav-bar{display:flex;justify-content:center;gap:6px;padding:10px 16px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:rgba(10,10,20,0.6);position:sticky;top:0;z-index:100;backdrop-filter:blur(8px)}
.nav-pill{font-family:'Cinzel',serif;font-size:0.52rem;letter-spacing:0.1em;text-transform:uppercase;padding:4px 10px;border-radius:12px;border:1px solid var(--border);color:var(--muted);text-decoration:none;transition:all 0.2s;white-space:nowrap}
.nav-pill:hover{color:var(--gold);border-color:var(--gold-border)}
.home-link{display:flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.15em;color:var(--muted);text-decoration:none;padding:10px 20px;border-bottom:1px solid var(--border);text-transform:uppercase;transition:color 0.2s}
.home-link:hover{color:var(--gold)}
.container{max-width:680px;margin:0 auto;padding:0 16px 60px}
.section{margin-top:28px}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.section-icon{font-size:1.1rem;flex-shrink:0}
.section-title{font-family:'Cinzel',serif;font-size:0.65rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);flex:1}
.story{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden}
.story::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--accent,var(--gold));opacity:0.5}
.story-headline{font-family:'Cinzel',serif;font-size:0.75rem;font-weight:700;letter-spacing:0.04em;color:var(--text);margin-bottom:8px;line-height:1.4}
.what-happened-label{font-family:'Cinzel',serif;font-size:0.52rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.story-body{font-size:0.88rem;line-height:1.6;color:rgba(224,216,240,0.8)}
.story-body p{margin-bottom:6px}
.story-body p:last-child{margin-bottom:0}
.story-tag{display:inline-block;font-family:'Cinzel',serif;font-size:0.48rem;letter-spacing:0.1em;text-transform:uppercase;padding:2px 7px;border-radius:8px;margin-bottom:6px}
.tag-breaking{background:rgba(192,48,74,0.15);color:#e05070;border:1px solid rgba(192,48,74,0.3)}
.tag-developing{background:rgba(224,90,32,0.12);color:#e07040;border:1px solid rgba(224,90,32,0.25)}
.tag-analysis{background:rgba(112,96,176,0.12);color:#9080d0;border:1px solid rgba(112,96,176,0.25)}
.tag-culture{background:rgba(200,168,48,0.12);color:var(--gold);border:1px solid var(--gold-border)}
.tag-science{background:rgba(32,160,144,0.12);color:#40c0b0;border:1px solid rgba(32,160,144,0.25)}
.tag-star{background:rgba(32,160,144,0.2);color:#40d0c0;border:1px solid rgba(32,160,144,0.4)}
.fact-box{background:rgba(200,168,48,0.05);border:1px solid var(--gold-border);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:0.8rem;color:rgba(200,168,48,0.9)}
.fact-box strong{color:var(--gold)}
.alert-box{background:rgba(192,48,74,0.06);border:1px solid rgba(192,48,74,0.25);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:0.8rem;color:rgba(240,112,144,0.9)}
.alert-box strong{color:#f07090}
.green-box{background:rgba(32,160,80,0.06);border:1px solid rgba(32,160,80,0.25);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:0.8rem;color:rgba(80,200,128,0.9)}
.green-box strong{color:#50c880}
.why-matters{margin-top:8px;font-size:0.8rem;line-height:1.5;color:rgba(160,200,240,0.8);font-style:italic;padding-left:10px;border-left:2px solid rgba(32,160,144,0.4)}
.perspectives{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.perspectives-label{font-family:'Cinzel',serif;font-size:0.52rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.perspective{display:grid;grid-template-columns:80px 1fr;gap:8px;margin-bottom:7px;font-size:0.82rem;line-height:1.45}
.perspective:last-child{margin-bottom:0}
.perspective-source{font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.05em;color:var(--muted);padding-top:2px;text-transform:uppercase}
.perspective-left .perspective-source{color:#6090e0}
.perspective-center .perspective-source{color:var(--muted)}
.perspective-right .perspective-source{color:#e09060}
.lean-badge{display:inline-block;font-size:0.45rem;padding:1px 4px;border-radius:4px;margin-left:3px;vertical-align:middle}
.lean-l{background:rgba(96,144,224,0.15);color:#6090e0}
.lean-c{background:rgba(96,96,160,0.15);color:#9090c0}
.lean-r{background:rgba(224,144,96,0.15);color:#e09060}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:24px 0}
.sources-section{font-size:0.68rem;color:var(--muted);line-height:1.8;padding:12px 16px;background:var(--card);border-radius:10px;border:1px solid var(--border)}
.sources-section strong{font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:6px}
.status{text-align:center;padding:48px 20px;color:var(--muted);font-size:0.9rem;font-style:italic}
.status button{margin-top:14px;display:block;margin-left:auto;margin-right:auto;font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.15em;text-transform:uppercase;padding:8px 18px;border-radius:12px;border:1px solid var(--gold-border);background:transparent;color:var(--gold);cursor:pointer}
.status button:hover{background:var(--gold-dim)}
.status code{font-family:ui-monospace,monospace;font-size:0.75rem;color:rgba(240,112,144,0.9);font-style:normal}
</style>
</head>
<body>
<a class="home-link" href="index.html">← Home</a>
<div class="masthead">
  <div class="masthead-top" id="masthead-top">Est. 2026 · Barcelona Edition · Curated by M</div>
  <div class="masthead-title">The Times of Chaos</div>
  <div class="masthead-sub">Hear All the Bells · Facts from Opinions</div>
  <div class="masthead-date" id="masthead-date">Loading…</div>
  <div class="masthead-rule"></div>
</div>
<nav class="nav-bar" id="nav-bar"></nav>
<div class="container" id="container">
  <div class="status" id="status">Fetching today's edition…</div>
</div>

<script>
/* ------------------------------------------------------------------
   THE TIMES OF CHAOS — durable renderer
   Reads dispatch_data.json (same folder, PUBLIC, no token required).
   To publish a new edition: overwrite dispatch_data.json. Nothing else.

   dispatch_data.json schema
   -------------------------
   {
     "date_label": "Monday, 29 June 2026 · Evening Edition",
     "masthead_note": "optional override of the small top line",
     "sections": [
       {
         "id": "conflicts", "icon": "⚔️", "title": "Active Conflicts",
         "stories": [
           {
             "tag": "Breaking",              // optional
             "tagClass": "tag-breaking",     // tag-breaking|tag-developing|tag-analysis|tag-culture|tag-science|tag-star
             "accent": "--rose",             // any CSS var from :root
             "headline": "…",
             "label": "What happened",       // optional, defaults to "What happened"
             "body": ["paragraph 1", "paragraph 2"],
             "boxes": [ {"type":"fact|alert|green", "html":"<strong>X:</strong> …"} ],
             "box":   {"type":"alert","html":"…"},   // singular also accepted
             "whyMatters": "italic why-it-matters note",
             "perspectives": [
               {"source":"El País","lean":"L","text":"…"}   // lean: L|C|R
             ]
           }
         ]
       }
     ],
     "sources": "Source A · Source B · …"
   }
   Only "headline" is required on a story. Everything else is optional.
   ------------------------------------------------------------------ */

const DATA_URL = 'dispatch_data.json';

const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const LEAN = {
  L: { cls: 'perspective-left',   badge: 'lean-l' },
  C: { cls: 'perspective-center', badge: 'lean-c' },
  R: { cls: 'perspective-right',  badge: 'lean-r' }
};

function renderBoxes(story) {
  let boxes = [];
  if (Array.isArray(story.boxes)) boxes = boxes.concat(story.boxes);
  if (story.box) boxes.push(story.box);
  return boxes.map((b) => {
    const type = (b && b.type) || 'fact';
    const cls = type === 'alert' ? 'alert-box' : type === 'green' ? 'green-box' : 'fact-box';
    return '<div class="' + cls + '">' + (b.html || esc(b.text)) + '</div>';
  }).join('');
}

function renderPerspectives(story) {
  const ps = Array.isArray(story.perspectives) ? story.perspectives : [];
  if (!ps.length) return '';
  const rows = ps.map((p) => {
    const lean = LEAN[(p.lean || 'C').toUpperCase()] || LEAN.C;
    const badge = p.lean ? '<span class="lean-badge ' + lean.badge + '">' + esc(p.lean.toUpperCase()) + '</span>' : '';
    return '<div class="perspective ' + lean.cls + '">' +
             '<span class="perspective-source">' + esc(p.source) + ' ' + badge + '</span>' +
             '<span>' + esc(p.text) + '</span>' +
           '</div>';
  }).join('');
  return '<div class="perspectives"><div class="perspectives-label">Perspectives</div>' + rows + '</div>';
}

function renderStory(story) {
  const accent = story.accent ? ' style="--accent:var(' + esc(story.accent) + ')"' : '';
  const tag = story.tag
    ? '<span class="story-tag ' + esc(story.tagClass || 'tag-analysis') + '">' + esc(story.tag) + '</span>'
    : '';
  const paras = (Array.isArray(story.body) ? story.body : story.body ? [story.body] : [])
    .map((p) => '<p>' + p + '</p>').join('');
  const bodyBlock = paras
    ? '<div class="what-happened-label">' + esc(story.label || 'What happened') + '</div>' +
      '<div class="story-body">' + paras + '</div>'
    : '';
  const why = story.whyMatters ? '<div class="why-matters">' + esc(story.whyMatters) + '</div>' : '';

  return '<div class="story"' + accent + '>' +
           tag +
           '<div class="story-headline">' + esc(story.headline) + '</div>' +
           bodyBlock +
           renderBoxes(story) +
           why +
           renderPerspectives(story) +
         '</div>';
}

function renderSection(section) {
  const stories = (section.stories || []).map(renderStory).join('');
  return '<section class="section" id="' + esc(section.id) + '">' +
           '<div class="section-header">' +
             '<span class="section-icon">' + esc(section.icon || '') + '</span>' +
             '<span class="section-title">' + esc(section.title) + '</span>' +
           '</div>' + stories +
         '</section>';
}

function renderNav(sections) {
  $('nav-bar').innerHTML = sections.map((s) =>
    '<a class="nav-pill" href="#' + esc(s.id) + '">' + esc(s.icon || '') + ' ' + esc(s.title) + '</a>'
  ).join('');
}

function render(data) {
  const sections = Array.isArray(data.sections) ? data.sections : [];
  if (data.masthead_note) $('masthead-top').textContent = data.masthead_note;
  $('masthead-date').textContent = data.date_label || '';
  renderNav(sections);

  let html = sections.map(renderSection).join('');
  if (data.sources) {
    html += '<div class="rule"></div>' +
            '<div class="sources-section"><strong>Sources Consulted</strong>' + esc(data.sources) + '</div>';
  }
  $('container').innerHTML = html || '<div class="status">No stories in this edition.</div>';
  document.title = 'The Times of Chaos — ' + (data.date_label || '');
}

function showError(msg) {
  $('masthead-date').textContent = '—';
  $('container').innerHTML =
    '<div class="status">Could not load this edition.<br><code>' + esc(msg) + '</code>' +
    '<button onclick="load()">Retry</button></div>';
}

async function load() {
  $('container').innerHTML = '<div class="status">Fetching today\'s edition…</div>';
  try {
    // cache-bust so a freshly pushed JSON shows up immediately
    const res = await fetch(DATA_URL + '?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' fetching ' + DATA_URL);
    const data = await res.json();
    render(data);
  } catch (err) {
    showError(err.message || String(err));
  }
}

load();
</script>
</body>
</html>
